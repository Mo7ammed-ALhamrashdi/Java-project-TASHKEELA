<!DOCTYPE html>

<html>

<head>

    <title>TASHKEELA Admin</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


<div class="navbar">

    <div class="logo">
        👑 TASHKEELA ADMIN
    </div>


    <a href="dashboard.html">
        Dashboard
    </a>

</div>




<div class="dashboard">



    <div class="sidebar">


        <h2>
            ADMIN PANEL
        </h2>


        <a href="admin.html">
            👥 Users
        </a>


        <a>
            📧 Email
        </a>


        <a>
            ⚙ Settings
        </a>


    </div>





    <div class="content">


        <h1>
            Admin Control Center
        </h1>


        <br>



        <div class="stats">


            <div class="card stat">

                <h3>
                    Total Users
                </h3>

                <h1 id="totalUsers">
                    0
                </h1>

            </div>




            <div class="card stat">

                <h3>
                    Admins
                </h3>

                <h1 id="totalAdmins">
                    0
                </h1>

            </div>




            <div class="card stat">

                <h3>
                    System Status
                </h3>

                <h1>
                    ONLINE
                </h1>

            </div>


        </div>




        <br>



        <div class="card">


            <h2>
                Create New User
            </h2>


            <br>


            <input id="fullName"
                   placeholder="Full Name">



            <input id="email"
                   placeholder="Email">



            <input id="password"
                   type="password"
                   placeholder="Password">



            <select id="role">


                <option value="USER">
                    USER
                </option>


                <option value="ADMIN">
                    ADMIN
                </option>


            </select>



            <br><br>


            <button onclick="createUser()">

                Create User

            </button>


        </div>





        <br>




        <div class="card">


            <h2>
                Users Management
            </h2>


            <br>


            <table class="table">


                <thead>

                <tr>

                    <th>ID</th>

                    <th>Name</th>

                    <th>Email</th>

                    <th>Role</th>

                    <th>Action</th>

                </tr>

                </thead>


                <tbody id="usersTable">


                </tbody>


            </table>



        </div>






        <br>




        <div class="card">


            <h2>
                Send Email
            </h2>


            <br>


            <input id="mailTo"
                   placeholder="User Email">



            <input id="mailMessage"
                   placeholder="Message">



            <button onclick="sendEmail()">

                Send

            </button>



        </div>




    </div>



</div>





<script src="script.js"></script>


<script>

    loadUsers();

</script>


</body>

</html>
